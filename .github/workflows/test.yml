# push / PR ごとにユニットテストと E2E（複数端末エミュレーション含む）を実行する。
# E2E は公開トラッカー経由で実際に P2P 接続するため、トラッカーの状態次第で
# 稀に不安定になる（retries: 2 で吸収）。
# workflow_dispatch: GitHub 側の障害などで実行が滞ったときに手動で流し直すため。
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ユニットテスト
        run: npm test
      - name: Playwright ブラウザの取得
        run: npx playwright install --with-deps chromium
      - name: E2E テスト
        run: npx playwright test
      - name: 失敗時レポートの保存
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
