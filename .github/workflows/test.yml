# push / PR ごとにユニットテストと E2E（複数端末エミュレーション含む）を実行する。
# E2E は実際に Trystero（BitTorrent トラッカー）経由で P2P 接続するため、
# トラッカーの状態次第で稀に不安定になる（retries: 2 で吸収）。
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ユニットテスト
        run: npm test
      - name: Playwright ブラウザの取得
        run: npx playwright install --with-deps chromium
      - name: E2E テスト
        run: npx playwright test
      - name: 失敗時レポートの保存
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
